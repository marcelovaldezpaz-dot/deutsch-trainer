<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#173a66"><link rel="manifest" href="manifest.webmanifest"><title>Deutsch Trainer</title><style>body{font-family:system-ui,sans-serif;background:#eef3fa;color:#172c46;margin:0}header{background:#173a66;color:white;padding:20px}main{max-width:650px;margin:auto;padding:16px}.card{background:white;border-radius:15px;padding:19px;margin:14px 0;box-shadow:0 2px 10px #152b4514}button,select,input{font:inherit;padding:12px;border-radius:9px;border:1px solid #b6c5d6}button{background:#195da6;color:white;border:0;cursor:pointer;margin:4px}button.secondary{background:#dce9f6;color:#153a62}input{width:calc(100% - 28px)}.muted{color:#58677a}.ok{color:#16734a}.bad{color:#b22d32}.chips span{display:inline-block;background:#e6effa;padding:8px;margin:3px;border-radius:7px;cursor:pointer}.hidden{display:none}progress{width:100%}</style></head><body><header><h2>🇩🇪 Deutsch Trainer</h2><div>Construye oraciones · A1 → A2 → B1</div></header><main><div class="card"><b id="level"></b><p id="stats" class="muted"></p><progress id="progress" max="100" value="0"></progress><p><button onclick="setMode('practice')">Practicar</button><button class="secondary" onclick="setMode('exam')">Evaluación (10)</button><button class="secondary" onclick="resetData()">Reiniciar</button></p></div><div class="card"><label>Tiempo verbal: <select id="tense" onchange="next()"><option value="mix">Mixto adaptativo</option><option value="present">Präsens</option><option value="perfect">Perfekt</option><option value="preterite">Präteritum</option><option value="future">Futur I</option></select></label><p id="topic" class="muted"></p><h3 id="prompt"></h3><div id="chips" class="chips"></div><p><input id="answer" autocomplete="off" autocapitalize="off" placeholder="Escribe la oración en alemán" onkeydown="if(event.key==='Enter')check()"></p><button onclick="check()">Comprobar</button><button class="secondary" onclick="next()">Otra oración</button><div id="feedback" aria-live="polite"></div></div><div class="card"><h3>Tu progreso</h3><div id="report"></div></div></main><script>
const bank=[
['A1','present','orden V2','Yo aprendo alemán.','Ich lerne Deutsch.','En una oración principal afirmativa, el verbo conjugado ocupa la segunda posición.','Ich lerne heute Deutsch.'],
['A1','present','orden V2','Hoy estudio alemán.','Heute lerne ich Deutsch.','Si empiezas con un complemento de tiempo, el verbo sigue en segunda posición.','Morgen arbeite ich.'],
['A1','present','conjugación','Él vive en Berlín.','Er wohnt in Berlin.','Con er/sie/es, los verbos regulares suelen terminar en -t.','Sie arbeitet in München.'],
['A1','present','sein','Nosotros estamos cansados.','Wir sind müde.','El verbo sein es irregular: ich bin, du bist, er ist, wir sind.','Ich bin müde.'],
['A1','present','haben','Ella tiene un perro.','Sie hat einen Hund.','Haben: ich habe, du hast, er/sie hat. Hund es masculino y objeto directo: einen Hund.','Er hat einen Bruder.'],
['A1','present','negación','Yo no tengo tiempo.','Ich habe keine Zeit.','Para negar un sustantivo sin artículo definido se usa kein/keine.','Ich habe kein Auto.'],
['A1','present','preguntas','¿Vives en Alemania?','Wohnst du in Deutschland?','En preguntas de sí/no, el verbo conjugado va primero.','Lernst du Deutsch?'],
['A1','present','modal','Yo puedo nadar.','Ich kann schwimmen.','Con modal, el infinitivo va al final.','Ich muss arbeiten.'],
['A1','perfect','Perfekt haben','He aprendido alemán.','Ich habe Deutsch gelernt.','Perfekt: haben conjugado + participio al final.','Ich habe heute gekocht.'],
['A1','perfect','Perfekt sein','He ido a casa.','Ich bin nach Hause gegangen.','Verbos de desplazamiento como gehen suelen formar Perfekt con sein.','Ich bin nach Berlin gefahren.'],
['A1','preterite','Präteritum sein','Ayer estaba cansado.','Gestern war ich müde.','El pasado simple de sein: ich war, du warst, er war, wir waren.','Gestern war ich krank.'],
['A1','preterite','Präteritum haben','Yo tenía tiempo.','Ich hatte Zeit.','El pasado simple de haben: ich hatte, du hattest, er hatte.','Wir hatten Hunger.'],
['A1','future','Futur I','Mañana estudiaré alemán.','Morgen werde ich Deutsch lernen.','Futur I: werden conjugado en segunda posición + infinitivo al final.','Ich werde morgen arbeiten.'],
['A2','present','subordinada weil','Me quedo en casa porque estoy enfermo.','Ich bleibe zu Hause, weil ich krank bin.','En subordinadas con weil, el verbo conjugado va al final.','Ich lerne, weil ich eine Prüfung habe.'],
['A2','perfect','participio irregular','He escrito una carta.','Ich habe einen Brief geschrieben.','Schreiben tiene participio irregular geschrieben. Brief es acusativo masculino: einen Brief.','Ich habe ein Buch gelesen.'],
['A2','perfect','separable','Me he levantado temprano.','Ich bin früh aufgestanden.','Aufstehen forma el participio aufgestanden y usa sein.','Ich bin um sieben Uhr aufgestanden.'],
['A2','future','Futur I','La próxima semana visitaremos a nuestros amigos.','Nächste Woche werden wir unsere Freunde besuchen.','Werden se conjuga y el infinitivo visitar queda al final.','Morgen werden wir zusammen lernen.'],
['A2','preterite','modal pasado','Yo tenía que trabajar.','Ich musste arbeiten.','En Präteritum, müssen → musste, con infinitivo al final.','Sie konnte nicht kommen.'],
['B1','present','obwohl','Aunque llueve, voy a caminar.','Obwohl es regnet, gehe ich spazieren.','En la subordinada con obwohl, el verbo va al final; en la principal, el verbo va inmediatamente después de la subordinada.','Obwohl ich müde bin, lerne ich.'],
['B1','perfect','subordinada Perfekt','Sé que él ha aprobado el examen.','Ich weiß, dass er die Prüfung bestanden hat.','En subordinadas con dass, el auxiliar conjugado se coloca al final.','Ich glaube, dass sie Deutsch gelernt hat.'],
['B1','future','futuro subordinado','Creo que mañana tendremos tiempo.','Ich glaube, dass wir morgen Zeit haben werden.','En una subordinada con Futur I, el auxiliar werden aparece al final.','Ich hoffe, dass er kommen wird.'],
['B1','preterite','narración','Cuando era niño, vivía en Bonn.','Als ich ein Kind war, wohnte ich in Bonn.','Als introduce un hecho o período único en el pasado; el verbo de la subordinada va al final.','Als ich klein war, spielte ich viel.']
];
let state=JSON.parse(localStorage.getItem('deutschTrainerV1')||'{"correct":0,"total":0,"streak":0,"mistakes":{},"exam":null,"history":[]}');let current=null,mode='practice',examCount=0,examRight=0,examLevel='A1',answered=false;const $=id=>document.getElementById(id);function save(){localStorage.setItem('deutschTrainerV1',JSON.stringify(state))}function level(){if(state.correct>=45&&state.total>=55)return 'B1';if(state.correct>=18&&state.total>=22)return 'A2';return 'A1'}function allowed(){let l=level();return bank.filter(x=>['A1','A2','B1'].indexOf(x[0])<=['A1','A2','B1'].indexOf(l))}function next(){answered=false;$('feedback').innerHTML='';$('answer').value='';let pool=mode==='exam'?bank.filter(x=>x[0]===examLevel):allowed();let t=$('tense').value;if(t!=='mix')pool=pool.filter(x=>x[1]===t);if(!pool.length){$('prompt').textContent='No hay ejercicios de este tiempo para el nivel actual.';return}let weighted=pool.flatMap(x=>Array(1+Math.min(3,state.mistakes[x[2]]||0)).fill(x));let options=weighted.filter(x=>x!==current);current=(options.length?options:weighted)[Math.floor(Math.random()*(options.length?options:weighted).length)];$('topic').textContent=`${current[0]} · ${current[2]} · ${mode==='exam'?'Pregunta '+(examCount+1)+'/10':'Práctica'}`;$('prompt').textContent=current[3];$('chips').innerHTML=current[4].replace(/[.,?!]/g,'').split(' ').sort(()=>Math.random()-.5).map(w=>`<span>${w}</span>`).join('');[...$('chips').children].forEach(e=>e.onclick=()=>{$('answer').value+=($('answer').value?' ':'')+e.textContent;$('answer').focus()});update()}
function norm(s){return s.toLocaleLowerCase('de-DE').trim().replace(/[.!?¿¡,]/g,'').replace(/\s+/g,' ')}function explain(input,target){let a=norm(input).split(' '),b=norm(target).split(' ');let missing=b.filter(w=>!a.includes(w));let extra=a.filter(w=>!b.includes(w));if(!missing.length&&!extra.length)return 'Tienes las palabras correctas, pero revisa su orden: '+current[5];if(missing.length)return 'Revisa estas palabras o formas: '+missing.join(', ')+'. '+current[5];return 'Revisa las palabras añadidas o incorrectas: '+extra.join(', ')+'. '+current[5]}
function check(){if(answered||!current)return;let input=$('answer').value.trim();if(!input)return;answered=true;let good=norm(input)===norm(current[4]);state.total++;state.correct+=good?1:0;state.streak=good?state.streak+1:0;state.history.push({date:new Date().toISOString(),topic:current[2],good,level:current[0]});if(!good)state.mistakes[current[2]]=(state.mistakes[current[2]]||0)+1;else state.mistakes[current[2]]=Math.max(0,(state.mistakes[current[2]]||0)-1);let msg=good?'<p class="ok"><b>✓ ¡Correcto!</b></p>':'<p class="bad"><b>✗ Hay un error.</b></p><p>'+explain(input,current[4])+'</p>';msg+='<p><b>Respuesta modelo:</b> '+current[4]+'</p><p><b>Regla:</b> '+current[5]+'</p><p><b>Otro ejemplo:</b> '+current[6]+'</p>';if(!good)msg+='<p><b>Refuerzo:</b> vuelve a escribir la oración correctamente y después construye una oración nueva siguiendo el ejemplo.</p><button onclick="retry()">Repetir este ejercicio</button>';else msg+='<button onclick="next()">Siguiente ejercicio →</button>';$('feedback').innerHTML=msg;if(mode==='exam'){examCount++;if(good)examRight++;if(examCount>=10){state.exam={level:examLevel,right:examRight,date:new Date().toISOString()};$('feedback').innerHTML+='<h3>Evaluación: '+examRight+'/10</h3><p>'+ (examRight>=9?'Excelente dominio en esta muestra.':examRight>=7?'Buen progreso; sigue reforzando errores.':'Necesitas reforzar este nivel antes de avanzar.')+'</p><button onclick="setMode(\'practice\')">Volver a practicar</button>';mode='practice'}}save();update()}
function retry(){answered=false;$('answer').value='';$('feedback').innerHTML='<p>Inténtalo de nuevo. Pista: '+current[5]+'</p>';$('answer').focus()}function setMode(m){mode=m;examCount=0;examRight=0;examLevel=level();next()}function update(){$('level').textContent='Nivel de práctica desbloqueado: '+level();$('stats').textContent=`${state.correct} aciertos / ${state.total} intentos · Racha: ${state.streak}`;$('progress').value=state.total?100*state.correct/state.total:0;let mistakes=Object.entries(state.mistakes).filter(x=>x[1]>0).sort((a,b)=>b[1]-a[1]).slice(0,4);$('report').innerHTML='<p>Precisión acumulada: '+(state.total?Math.round(state.correct/state.total*100):0)+'%</p><p>Áreas para reforzar: '+(mistakes.length?mistakes.map(x=>x[0]+' ('+x[1]+')').join(', '):'Todavía no hay errores registrados')+'</p><p>Última evaluación: '+(state.exam?state.exam.level+' · '+state.exam.right+'/10':'Pendiente')+'</p><small class="muted">El nivel es orientativo y solo mide ejercicios escritos de este banco, no equivale a un examen oficial CEFR.</small>'}function resetData(){if(confirm('¿Eliminar todo tu progreso?')){localStorage.removeItem('deutschTrainerV1');location.reload()}}if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});next();
</script></body></html>
